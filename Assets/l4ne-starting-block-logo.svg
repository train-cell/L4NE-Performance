      <!-- 4 -->
      <path d="M 176 365 L 128 365 L 128 349 L 171 296 L 193 296 L 154 346 L 176 346 L 176 322 L 196 322 L 196 346 L 209 346 L 209 365 L 196 365 L 196 383 L 176 383 Z" />
      <!-- N -->
      <path d="M 222 296 L 242 296 L 283 350 L 283 296 L 304 296 L 304 383 L 284 383 L 243 328 L 243 383 L 222 383 Z" />
      <!-- E -->
      <path d="M 320 296 L 388 296 L 388 314 L 341 314 L 341 330 L 382 330 L 382 348 L 341 348 L 341 365 L 389 365 L 389 383 L 320 383 Z" />
    </g>
  </g>
</svg>
