<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <mask id="pedestal-cutout">
      <rect x="0" y="0" width="400" height="420" fill="white" />
      <!-- Cutout for the backstroke grip bar channel inside the pedestal -->
      <path d="M 172 136 L 295 157 A 10 10 0 0 1 292 177 L 169 156 A 10 10 0 0 1 172 136 Z" fill="black" />
      <!-- Cutout for the iconic '4' inside the starting block pedestal -->
      <path d="M 205 218 L 170 218 L 170 205 L 198 162 L 214 162 L 188 204 L 205 204 L 205 186 L 220 186 L 220 204 L 229 204 L 229 218 L 220 218 L 220 233 L 205 233 Z" fill="black" />
    </mask>
  </defs>

  <!-- Official L4NE Starting Block #4 (Βατήρας Εκκίνησης) -->
  <g fill="#F1F5F9">
    <!-- 1. Top-left Track-Start Rear Wedge Fin -->
    <path d="M 126 38 C 127 35 131 35 133 37 L 174 74 L 138 68 L 126 38 Z" />

    <!-- 2. Slanted Top Diving Platform Deck -->
    <rect x="112" y="74" width="212" height="11" rx="5.5" transform="rotate(9.8 112 74)" />

