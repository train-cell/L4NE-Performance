    <!-- 7. Lower-Left Step Bar & Support Wedge -->
    <rect x="92" y="196" width="54" height="10" rx="3" />
    <path d="M 108 214 L 140 214 L 131 231 Z" />

    <!-- 8. Horizontal Bottom Base Plate -->
    <rect x="116" y="259" width="132" height="9" rx="4.5" />

